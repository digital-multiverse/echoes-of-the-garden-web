# The site lives on Cloudflare Workers (wrangler.jsonc). Netlify only sends old links to the real domain.
[build]
  functions = "netlify/functions"
  publish   = "."

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "https://echoesofthegarden.com/:splat"
  status = 301
  force  = true
