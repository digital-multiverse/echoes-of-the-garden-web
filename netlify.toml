[build]
  functions = "netlify/functions"
  publish   = "."

[build.environment]
  NODE_VERSION = "20"

# Headers live in _headers, shared with Cloudflare Workers until the cut-over.

# The page posts to /api/*: the same index.html works on Netlify and on the Worker.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/bestiary/*"
  to     = "/bestiary/:splat/index.html"
  status = 200
